defaults: 
  - judge: hb_judge
  - attacker: variational
  - loss: elbo_reinforce
  - optimizer: adamw
  - target: llama3-local
  - data: advbench_direct

device: cuda
num_queries: 100
batch_size: 4
acc_size: 8
save_dir: training/target_${target.model_name}/attacker_${attacker.base_model_id}/judge_${judge.model_name}/
checkpoint_every: 1000
log_every: 1
val_every: 1000
attacker_device: cuda:1
attacker_device2: cuda:3
judge_device: cuda:5
max_queries: 40
threshold: 0.95